<style>
/* Layout: one-column phone app, fixed bottom tab bar + floating add button; sheets slide up from the bottom. */
:root {

  --surface: #ffffff;

  --warn: #a86200;
  --bad: #c0362c;
  --good-bg: #e3f4ea;
  --warn-bg: #fbf0dc;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #181e2a; --surface-2: #222a39; --ink: #eef1f7; --ink-2: #b4bccb; --ink-3: #8f98aa;
    --line: #2c3546; --accent: #8fa8ff; --accent-ink: #0f131b; --ess: #3987e5; --rec: #d95926;
    --good: #4fcf8d; --warn: #f0b04a; --bad: #ff7a6e; --good-bg: #15301f; --warn-bg: #33270f; --bad-bg: #3a1b18; --bubble: #2c2716;
    --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #181e2a; --surface-2: #222a39; --ink: #eef1f7; --ink-2: #b4bccb; --ink-3: #8f98aa;
  --line: #2c3546; --accent: #8fa8ff; --accent-ink: #0f131b; --ess: #3987e5; --rec: #d95926;
  --good: #4fcf8d; --warn: #f0b04a; --bad: #ff7a6e; --good-bg: #15301f; --warn-bg: #33270f; --bad-bg: #3a1b18; --bubble: #2c2716;
  --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 140px; display: grid; gap: 16px; }
#view { display: grid; gap: 16px; min-width: 0; }

.brand { white-space: nowrap; font-size: 18px !important; min-width: 0; flex: 1 1 auto; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; min-height: 40px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }

/* Logo: marca verde con moneda y check + nombre en dos tonos. Solo se ve en Inicio. */
.brand { display: flex; align-items: center; gap: 9px; }

.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

.plantabs { display: flex; width: 100%; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.split3 { display: flex; height: 18px; border-radius: 6px; overflow: hidden; gap: 2px; }

.dist { display: grid; gap: 8px; }
.dist .row3 { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; font-size: 14px; }
.dist .row3 .pct { color: var(--ink-3); font-size: 12px; }
.pm { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.pm .top { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.pm .top label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.pm.dup { opacity: .6; }
.cls .mini-x, .cls .chip-btn { flex: none; white-space: nowrap; }
.pm select { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%; }
.busy { display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
.busy::before { content: ''; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.io { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.io div { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.io b { display: block; font-family: var(--f-display); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.io .in b { color: var(--good); }
.io .neg b { color: var(--bad); }

.split { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
.split i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.ess { background: var(--ess); } .rec { background: var(--rec); }

.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.bar .name { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.bar .amt { font-weight: 600; font-size: 14px; text-align: right; }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; }
.bar .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar .meta { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
.up { color: var(--bad); } .down { color: var(--good); }

.tips { display: grid; gap: 10px; }
.tip { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; background: var(--surface-2); }
.tip .t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.tip .t em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; flex: none; }
.tip.bien { background: var(--good-bg); } .tip.bien em { color: var(--good); border: 1px solid var(--good); }
.tip.ojo { background: var(--warn-bg); } .tip.ojo em { color: var(--warn); border: 1px solid var(--warn); }
.tip.alerta { background: var(--bad-bg); } .tip.alerta em { color: var(--bad); border: 1px solid var(--bad); }
.tip p { font-size: 14px; color: var(--ink-2); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; justify-self: start; }

/* Bienvenida */
.onb { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.onb-in { max-width: 460px; margin: 0 auto; display: grid; gap: 16px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 28px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.pet-row.big { grid-template-columns: 1fr; justify-items: center; }
.pet-row.big .pet-btn, .pet-row.big .pet-btn svg { width: 120px; height: 120px; }
.onb .say { max-width: 100%; font-size: 17px; }
.onb-body { display: grid; gap: 10px; }
.choices { display: grid; gap: 8px; }
.choices button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-weight: 600; font-size: 16px; text-align: left; }
.choices button[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
.onb-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* Mascota: conversación tipo cómic */
.pet-panel { display: grid; gap: 10px; }
.pet-panel:empty { display: none; }
.convo { display: grid; gap: 8px; }
.say { position: relative; max-width: 88%; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 18px; box-shadow: 3px 3px 0 var(--ink); font-family: var(--f-comic); font-weight: 700; font-size: 15px; line-height: 1.35; }
.say p { min-height: 1.35em; }
.say.pet { background: var(--bubble); justify-self: start; border-bottom-left-radius: 6px; }
.say.pet:not(.now) { opacity: .75; box-shadow: none; }
.say.pet b { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); margin-bottom: 2px; }
.say.pet.now::after { content: ""; position: absolute; left: 18px; bottom: -14px; border: 7px solid transparent; border-top: 9px solid var(--ink); border-left-width: 4px; }
.say.pet.now::before { content: ""; position: absolute; left: 20px; bottom: -9px; border: 5px solid transparent; border-top: 7px solid var(--bubble); border-left-width: 3px; z-index: 1; }
.say.me { justify-self: end; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: none; border-bottom-right-radius: 6px; font-size: 14px; }
.pet-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; }
.pet-btn { border: 0; background: none; padding: 0; width: 86px; height: 86px; }
.pet-btn svg { width: 86px; height: 86px; display: block; }
.pet-btn:active svg { transform: scale(.94); }
/* La mascota se mueve según su ánimo: la cabeza (.ph) y el cuerpo (.pb) por separado. */
.pet-svg .ph, .pet-svg .pb { transform-box: view-box; transform-origin: 50% 66%; }
@media (prefers-reduced-motion: no-preference) {
  .pet-btn .pet-svg, .pets .pet-svg { animation: bob 3.2s ease-in-out infinite; }
  .m-happy .ph { animation: sway 2.6s ease-in-out infinite; }
  .m-laugh { animation: hop .5s ease-in-out infinite !important; }
  .m-laugh .ph { animation: giggle .25s ease-in-out infinite alternate; }
  .m-angry { animation: shake .35s linear infinite !important; }
  .m-angry .ph { animation: fume 1.4s ease-in-out infinite; }
  .m-sad .ph { animation: droop 3.6s ease-in-out infinite; }
  .m-sad { animation: sink 3.6s ease-in-out infinite !important; }
  .m-surprised { animation: jump 1.8s ease-out infinite !important; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes hop { 50% { transform: translateY(-5px); } }
  @keyframes giggle { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes shake { 0%, 50%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  @keyframes fume { 50% { transform: scale(1.04); } }
  @keyframes droop { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg) translateY(2px); } }
  @keyframes sink { 50% { transform: translateY(2px); } }
  @keyframes jump { 0%, 60%, 100% { transform: translateY(0); } 15% { transform: translateY(-9px) scale(1.04); } 30% { transform: translateY(0); } }
}
.replies { display: flex; flex-wrap: wrap; gap: 6px; }
.replies button { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--f-comic); font-weight: 700; font-size: 13px; }
.replies button:active { transform: translate(1px, 1px); }
.pet-panel.compact .pet-row { grid-template-columns: 56px 1fr; }
.pet-panel.compact .pet-btn, .pet-panel.compact .pet-btn svg { width: 66px; height: 66px; }
.pet-pop { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 32px); max-width: 488px; z-index: 20; background: var(--surface); box-shadow: var(--shadow); border-radius: 18px; padding: 12px; }
.pet-pop .pet-row { grid-template-columns: 56px 1fr; }
.pet-pop .pet-btn, .pet-pop .pet-btn svg { width: 66px; height: 66px; }
.pet-pop .say { max-width: 100%; }

.guide { width: 100%; border-collapse: collapse; font-size: 14px; }
.guide th, .guide td { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.guide th:first-child, .guide td:first-child { text-align: left; }
.guide th { font-size: 12px; color: var(--ink-3); font-weight: 600; }

.classes { display: grid; gap: 8px; }
.cls { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cls .name { display: flex; gap: 8px; align-items: center; min-width: 0; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.mini-x { border: 0; background: none; color: var(--bad); font-size: 13px; font-weight: 600; padding: 4px 6px; }

.list { display: grid; gap: 4px; }
.day { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: capitalize; padding: 10px 4px 2px; display: flex; justify-content: space-between; }
.row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 0; border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 14px; color: #fff; }
.row .ic.inc { background: var(--good); }
.row .txt { min-width: 0; }
.row .txt b { font-weight: 600; display: block; font-size: 14px; }
.row .txt span { color: var(--ink-3); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { font-weight: 600; text-align: right; }
.row .v small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-3); }
.row .v.inc { color: var(--good); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
.empty { text-align: center; color: var(--ink-3); padding: 28px 12px; }

/* Tasas */
.rates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rate { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; min-width: 0; }
.rate .v { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.rate .v small { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.rate svg { width: 100%; height: 34px; display: block; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); justify-self: start; }
.gap-line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.conv-out { display: grid; gap: 8px; }

.conv-out b { font-family: var(--f-display); font-size: 18px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr 1fr 58px 1fr 1fr 1fr; padding-left: 4px; padding-right: 4px; align-items: center; z-index: 5; }
nav.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 10px; letter-spacing: -.02em; white-space: normal; text-align: center; line-height: 1.1; min-width: 0; font-weight: 600; color: var(--ink-3); padding: 6px 0; }
nav.tabs button svg { width: 22px; height: 22px; display: block; }
nav.tabs { backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); background: color-mix(in srgb, var(--surface) 88%, transparent); }

<script>
(() => {
'use strict';
// ---------- Tasas de respaldo (última consulta al publicar esta versión) ----------
const RATES_SEED = { bcv: { rate: 874.7321, date: '2026-10-08', at: '2026-10-09T15:00:00Z' }, usdt: { rate: 1019.8, at: '2026-10-09T15:00:00Z' } };

// ---------- Estado ----------
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---------- Bloqueo con huella ----------
// La huella la verifica el propio teléfono (WebAuthn con el lector del equipo, sin servidor).
// Protege contra quien agarre el teléfono; el PIN es el respaldo si la huella no está disponible.
const LOCK = Object.assign({ on: false, cred: null, pin: null, salt: null }, lsGet('cc.lock', {}) || {});
const LK = { mode: 'bio', err: '', busy: false, fails: 0, until: 0 };
const LKS = { bio: null };
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const ub64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
const rnd32 = () => crypto.getRandomValues(new Uint8Array(32));
async function pinHash(pin, salt) { return b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin))); }
async function bioAvailable() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } }
bioAvailable().then(v => { LKS.bio = v; });
async function bioCreate(name) {
  const c = await navigator.credentials.create({ publicKey: { rp: { name: 'Cuentas Claras' }, user: { id: rnd32().slice(0, 16), name: 'cuentas-claras', displayName: name || 'Cuentas Claras' }, challenge: rnd32(), pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none' } });
  if (!c) throw new Error('cancel'); return b64u(c.rawId);
}
async function bioCheck() {
  // Si el teléfono no responde (pasa al abrir la app instalada), se cancela solo y el botón sigue disponible.
  const ac = new AbortController(); LK.ac = ac; const t = setTimeout(() => ac.abort(), 20000);
  let a; try { a = await navigator.credentials.get({ signal: ac.signal, publicKey: { challenge: rnd32(), allowCredentials: [{ type: 'public-key', id: ub64u(LOCK.cred), transports: ['internal'] }], userVerification: 'required', timeout: 20000 } }); }
  finally { clearTimeout(t); if (LK.ac === ac) LK.ac = null; }
  if (!a) throw new Error('cancel');
  if (!(new Uint8Array(a.response.authenticatorData)[32] & 4)) throw new Error('uv'); // el teléfono confirmó que eras tú
}
const lockSave = () => lsSet('cc.lock', LOCK);
function lockDraw() {
  let r = document.getElementById('lockRoot'); if (!r) { r = document.createElement('div'); r.id = 'lockRoot'; document.body.appendChild(r); }
  const mode = LOCK.cred ? LK.mode : 'pin';
  r.innerHTML = `<div class="lock" role="dialog" aria-modal="true" aria-labelledby="lkTitle">${lockScene(LK.err ? 'sad' : 'happy')}<h2 id="lkTitle">Cuentas Claras</h2><p class="note">Tus cuentas están protegidas.</p>
    ${mode === 'bio' ? `<button class="primary" id="lkBio">☝️ ${LK.busy ? 'Pon tu dedo en el lector…' : 'Desbloquear con huella'}</button><button class="linkbtn" id="lkUsePin">Usar mi PIN</button>`
      : `<input id="lkPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" aria-label="PIN"><button class="primary" id="lkPinGo">Entrar</button>${LOCK.cred ? '<button class="linkbtn" id="lkUseBio">Usar huella</button>' : ''}`}
    ${LK.err ? `<p class="err" role="alert">${LK.err}</p>` : ''}
    <button class="linkbtn lk-forgot" id="lkForgot">Olvidé mi PIN</button></div>`;
  const i = r.querySelector('#lkPin'); if (i) i.focus();
}
// Tu mascota espera frente a una puerta cerrada; al desbloquear, la puerta se abre y entras a la app.
function lockPet() { const c = (S.cfg && S.cfg.mascot && S.cfg.mascot.kind) || ((lsGet('cc.cfg', {}) || {}).mascot || {}).kind || LOCK.pet || 'cerdito'; return PETS[c] ? c : (c === 'off' ? null : 'cerdito'); }
function lockScene(mood) {
  const k = lockPet();
  return `<div class="lk-scene" aria-hidden="true"><div class="lk-frame"><div class="lk-in"></div><div class="lk-panel"><i></i><i></i><span class="lk-knob"></span><span class="lk-pad">🔒</span></div></div>${k ? `<div class="lk-pet">${petSVG(k, mood)}</div>` : ''}</div>`;
}
function unlock() {
  LK.err = ''; LK.fails = 0;
  const r = document.getElementById('lockRoot'); if (!r) { document.body.classList.remove('locked'); return; }
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const k = lockPet(); const pet = r.querySelector('.lk-pet'); if (pet && k) pet.innerHTML = petSVG(k, 'laugh');
  r.querySelectorAll('button, input').forEach(x => { x.disabled = true; });
  r.classList.add('open');
  setTimeout(() => { document.body.classList.remove('locked'); r.classList.add('leaving'); }, still ? 0 : 950);
  setTimeout(() => r.remove(), still ? 0 : 1450);
}
async function tryBio(silent) {
  if (LK.busy) { if (silent) return; if (LK.ac) LK.ac.abort(); await new Promise(r => setTimeout(r, 150)); } // un toque nuevo reinicia la lectura
  const run = (LK.run || 0) + 1; LK.run = run; LK.busy = true; LK.err = ''; lockDraw();
  try { await bioCheck(); if (LK.run !== run) return; LK.busy = false; unlock(); }
  catch (e) { if (LK.run !== run) return; LK.busy = false; LK.err = silent ? '' : 'No se pudo leer la huella. Intenta de nuevo o usa tu PIN.'; if (document.getElementById('lockRoot')) lockDraw(); }
}
// Pide la huella sola solo cuando la app ya se ve en pantalla (no durante el arranque).
function bioAuto() {
  const go = () => {
    if (document.visibilityState !== 'visible' || !document.body.classList.contains('locked')) return;
    document.removeEventListener('visibilitychange', go);
    requestAnimationFrame(() => setTimeout(() => { if (document.body.classList.contains('locked') && LK.mode === 'bio') tryBio(true); }, 600));
  };
  document.addEventListener('visibilitychange', go); go();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && LK.ac) LK.ac.abort(); });
async function tryPin(v) {
  if (Date.now() < LK.until) { LK.err = 'Muchos intentos. Espera 30 segundos.'; return lockDraw(); }
  if (LOCK.pin && v && await pinHash(v, LOCK.salt) === LOCK.pin) return unlock();
  LK.fails++; if (LK.fails >= 5) { LK.until = Date.now() + 30000; LK.fails = 0; }
  LK.err = 'PIN incorrecto.'; lockDraw();
}
document.addEventListener('click', async e => {
  const t = e.target.closest && e.target.closest('button'); if (!t) return;
  if (t.id === 'lkBio') return tryBio(false);
  if (t.id === 'lkUsePin') { LK.mode = 'pin'; LK.err = ''; return lockDraw(); }
  if (t.id === 'lkUseBio') { LK.mode = 'bio'; LK.err = ''; return lockDraw(); }
  if (t.id === 'lkPinGo') return tryPin(document.getElementById('lkPin').value.trim());
  if (t.id === 'lkForgot') {
    if (confirm('Sin el PIN solo puedo quitar el bloqueo borrando los datos guardados en este teléfono. Esto no se puede deshacer. ¿Borrar y quitar el bloqueo?')) {
      try { Object.keys(localStorage).filter(k => k.startsWith('cc.')).forEach(k => localStorage.removeItem(k)); } catch (err) {}
      location.reload();
    }
    return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'lkPin') tryPin(e.target.value.trim()); });
if (LOCK.on && LOCK.pin) document.body.classList.add('locked'); // la pantalla se dibuja al final, cuando ya existen las mascotas
const S = {
  tx: [],
  cfg: {
    lang: lsGet('cc.lang', 'es'), theme: lsGet('cc.theme', 'auto'), mainCur: 'USD', convRate: 'bcv', incomeCur: 'USD',
    opening: null, user: null, mascot: { kind: 'cerdito', name: 'Chanchito' }, customCats: [], ess: {}, manualRates: {}, reminders: { daily: { on: true, time: '20:00' }, payday: { on: false, days: '15, 30' }, bills: [] }, plan: { salary: null, cur: 'USD', goals: [] }, fixed: [], debts: [],
  },
  rates: null,
  month: '', tab: 'inicio', demoHidden: false, loaded: false, petIdx: 0,
};
const T = (es, en) => S.cfg.lang === 'en' ? en : es;
const loc = () => S.cfg.lang === 'en' ? 'en-US' : 'es-VE';

function monthStats(list, mk) {

  const incs = m.filter(t => t.type === 'ingreso');
  const inc = incs.reduce((a, t) => a + txVal(t), 0);

  const exp = exps.reduce((a, t) => a + txVal(t), 0);

  exps.forEach(t => { byCat[t.cat] = (byCat[t.cat] || 0) + txVal(t); });
  let ess = 0, rec = 0; Object.entries(byCat).forEach(([k, v]) => { if (isEss(k)) ess += v; else rec += v; });
  return { m, exps, inc, exp, byCat, ess, rec, bal: inc - exp };
}
// Dos bolsillos: lo disponible para gastar y el ahorro. Los ingresos entran a lo disponible;

function pockets(list) {
  const today = todayISO(); const oc = o => o && o.amount ? conv(o.amount, o.cur, S.cfg.mainCur) : 0;
  let disp = oc(S.cfg.opening), save = oc(S.cfg.openingSave);
  list.forEach(t => {
    if (t.date > today) return; const v = txVal(t);
    if (t.type === 'ingreso') disp += v;
    else if (t.type === 'gasto') { if (t.from === 'ahorro') save -= v; else disp -= v; }
    else if (t.type === 'deuda') { if (t.flow === 'in') disp += v; else disp -= v; }
    else if (t.type === 'ahorro') { if (t.to === 'disponible') { save -= v; disp += v; } else { disp -= v; save += v; } }
  });
  return { disp, save, total: disp + save };
}

function savedNet(list, mk) {

    if (t.type === 'ahorro') n += t.to === 'disponible' ? -v : v;

function advice(list, mk) {
  const s = monthStats(list, mk);
  const tips = []; const facts = {};
  if (!s.m.length) return { s, tips, facts };
  const prev = [1, 2, 3].map(k => monthStats(list, shiftMonth(mk, -k))).filter(p => p.exp > 0);
  if (s.inc > 0) {
    const saved = savedNet(list, mk); const r = saved / s.inc; facts.rate = r; facts.saved = saved;
    if (s.bal < 0) tips.push({ lv: 'alerta', t: T('Gastaste más de lo que entró', 'You spent more than you earned'), p: T(`Este mes vas ${money(-s.bal)} por encima de tus ingresos. Empieza recortando lo marcado como gusto.`, `You're ${money(-s.bal)} over your income this month. Start with the cuttable categories.`) });
    if (saved <= 0 && s.bal > 0) tips.push({ lv: 'ojo', t: T('Todavía no apartas nada al ahorro', "You haven't saved anything yet"), p: T(`Te quedan ${money(s.bal)} sin gastar este mes, pero eso no es ahorro hasta que lo apartes. Usa "Apartar" en Inicio.`, `You have ${money(s.bal)} unspent this month, but it isn't savings until you set it aside. Use "Save" on Home.`) });
    else if (r > 0 && r < 0.1) tips.push({ lv: 'ojo', t: T(`Apartaste solo ${pct(r)} de lo que ganas`, `You set aside only ${pct(r)}`), p: T(`Una meta sana es 10% a 20%. Te faltan ${money(s.inc * 0.1 - saved)} para llegar al 10%.`, `A healthy goal is 10–20%. You need ${money(s.inc * 0.1 - saved)} more to reach 10%.`) });
    else if (r >= 0.2) tips.push({ lv: 'bien', t: T(`Apartaste ${pct(r)} de tus ingresos`, `You set aside ${pct(r)} of your income`), p: T(`Este mes metiste ${money(saved)} al ahorro. Así se hace.`, `You put ${money(saved)} into savings this month. Well done.`) });
    else if (r > 0) tips.push({ lv: 'bien', t: T(`Apartaste ${pct(r)} de tus ingresos`, `You set aside ${pct(r)} of your income`), p: T(`Vas bien. Llegar al 20% significa apartar ${money(s.inc * 0.2 - saved)} más.`, `Good. Reaching 20% means saving ${money(s.inc * 0.2 - saved)} more.`) });
  } else if (s.exp > 0) {
    facts.noIncome = true;
    tips.push({ lv: 'ojo', t: T('Aún no anotas ingresos este mes', 'No income logged this month'), p: T('Anota tu sueldo para saber cuánto puedes ahorrar.', 'Log your salary to see how much you can save.') });
  }
  if (s.exp > 0) {
    const share = s.rec / s.exp;
    const top = allCats().filter(c => !isEss(c.id) && s.byCat[c.id] > 0).sort((a, b) => s.byCat[b.id] - s.byCat[a.id])[0];
    if (top) {
      const cut = s.byCat[top.id] * 0.25;
      tips.push({ lv: share > 0.3 ? 'ojo' : 'bien', t: T(`Recortar 25% de ${catName(top)} libera ${money(cut)} al mes`, `Cutting 25% of ${catName(top)} frees ${money(cut)} a month`), p: T(`Son unos ${money(cut * 12)} al año. Lo que gastas en gustos es ${pct(share)} de tus gastos${share > 0.3 ? ', más de lo recomendable (30%)' : ''}.`, `That's about ${money(cut * 12)} a year. Cuttable spending is ${pct(share)} of your expenses${share > 0.3 ? ', above the recommended 30%' : ''}.`) });
    }
    if (prev.length) {
      allCats().forEach(c => {
        const avg = prev.reduce((a, p) => a + (p.byCat[c.id] || 0), 0) / prev.length;
        const cur = s.byCat[c.id];
        if (avg > 0 && cur > avg * 1.25 && cur - avg > s.exp * 0.03) {
          if (!facts.up || cur / avg > facts.up.ratio) facts.up = { cat: c, ratio: cur / avg };
          tips.push({ lv: isEss(c.id) ? 'ojo' : 'alerta', t: T(`${catName(c)} subió ${pct(cur / avg - 1)}`, `${catName(c)} is up ${pct(cur / avg - 1)}`), p: T(`Llevas ${money(cur)} contra ${money(avg)} en promedio${prev.length > 1 ? ` de los últimos ${prev.length} meses` : ' el mes pasado'}.`, `${money(cur)} so far vs. ${money(avg)} on average${prev.length > 1 ? ` over the last ${prev.length} months` : ' last month'}.`) });
        }
      });
    }
    const subs = s.exps.filter(t => t.cat === 'suscripciones');
    if (subs.length >= 2) {
      const names = [...new Set(subs.map(t => t.note).filter(Boolean))].slice(0, 6).join(', ');
      const tot = subs.reduce((a, t) => a + txVal(t), 0); facts.subs = { n: subs.length, tot };
      tips.push({ lv: 'ojo', t: T(`${subs.length} suscripciones suman ${money(tot)}`, `${subs.length} subscriptions add up to ${money(tot)}`), p: `${names ? names + '. ' : ''}${T(`Cancela las que no usaste este mes; al año son ${money(tot * 12)}.`, `Cancel the ones you didn't use; that's ${money(tot * 12)} a year.`)}` });
    }
    const small = s.exps.filter(t => !isEss(t.cat) && txVal(t) <= s.exp * 0.015);
    if (small.length >= 5) {
      const tot = small.reduce((a, t) => a + txVal(t), 0); facts.ants = { n: small.length, tot };
      tips.push({ lv: 'ojo', t: T(`${small.length} gastos hormiga suman ${money(tot)}`, `${small.length} small purchases add up to ${money(tot)}`), p: T('Son compras chicas en categorías de gustos (cafés, chucherías, apps). Ponles un tope semanal.', 'Small buys in cuttable categories (coffee, snacks, apps). Give them a weekly cap.') });
    }
    if ((s.byCat.varios || 0) / s.exp > 0.15) {
      tips.push({ lv: 'ojo', t: T(`Gastos varios es ${pct(s.byCat.varios / s.exp)} del total`, `Misc. is ${pct(s.byCat.varios / s.exp)} of the total`), p: T('Es mucho dinero sin nombre. Usa una categoría más precisa o crea una nueva en Ajustes.', 'That is a lot of unnamed money. Use a more precise category or create one in Settings.') });
    }
  }
  const order = { alerta: 0, ojo: 1, bien: 2 };
  tips.sort((a, b) => order[a.lv] - order[b.lv]);
  return { s, tips, facts };
}

}
function onbCheck() {

document.addEventListener('click', e => {
  const b = e.target.closest('[data-onb],[data-onb-g],[data-onb-pet],[data-onb-cur]'); if (!b || !b.closest('#onbRoot')) return;

const CONV = { amount: '', from: 'USD' };
function spark(kind) {
  const h = (S.rates && Array.isArray(S.rates.history) ? S.rates.history : []).filter(x => x[kind] > 0).slice(-30);
  if (h.length < 2) return '';
  const vals = h.map(x => x[kind]); const mn = Math.min(...vals), mx = Math.max(...vals); const span = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * 96 + 2, 30 - (v - mn) / span * 26]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none" role="img" aria-label="${T('Tendencia', 'Trend')} ${h.length} ${T('días', 'days')}"><path d="${d} L98 34 L2 34 Z" fill="var(--ess)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--ess)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--ess)"/></svg>`;
}

const suggReady = () => !!(SUGG.form && SUGG.name && SUGG.email && SUGG.text);
async function suggPost(x) {
  const f = new URLSearchParams(); f.set(SUGG.name, x.name); f.set(SUGG.email, x.email); f.set(SUGG.text, x.text); if (SUGG.meta) f.set(SUGG.meta, x.meta);

async function suggFlush() {

}

function planCalc() {

  const hist = [1, 2, 3].map(k => monthStats(S.tx, shiftMonth(now, -k))).filter(m => m.exp > 0 || m.inc > 0);
  const cur = monthStats(S.tx, now);
  const base = hist.length ? hist : (cur.exp > 0 || cur.inc > 0 ? [cur] : []);
  const avg = f => base.length ? base.reduce((a, m) => a + f(m), 0) / base.length : 0;
  const avgInc = avg(m => m.inc);
  const salary = P.salary ? conv(P.salary, P.cur || 'USD', S.cfg.mainCur) : avgInc;
  const essCats = {}, cutCats = {};
  allCats().forEach(c => { const v = avg(m => m.byCat[c.id] || 0); if (v > 0) (isEss(c.id) ? essCats : cutCats)[c.id] = v; });
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  const hasHist = sum(essCats) + sum(cutCats) > 0;
  const ess = hasHist ? sum(essCats) : salary * 0.5;
  let pool = Math.max(pockets(S.tx).save, 0);
  const goals = (P.goals || []).map(x => {
    const target = conv(x.amount, x.cur || 'USD', S.cfg.mainCur); const have = Math.min(pool, target); pool -= have;
    const left = Math.max(target - have, 0); const ml = x.date ? Math.max(1, monthsBetween(now, x.date)) : null;
    return { ...x, target, have, left, ml, need: ml ? left / ml : 0 };
  });
  const goalNeed = goals.reduce((a, g) => a + g.need, 0);
  let save = Math.max(goalNeed, salary * 0.2); let fun = salary - ess - save; let tight = false;
  if (fun < salary * 0.05) { tight = goalNeed > 0 || ess > salary * 0.8; save = Math.max(salary - ess - salary * 0.05, 0); fun = Math.max(salary - ess - save, 0); }
  if (!goals.length && fun > salary * 0.3) { save += fun - salary * 0.3; fun = salary * 0.3; }
  const cutTot = sum(cutCats); const caps = {};
  Object.entries(cutCats).forEach(([k, v]) => { caps[k] = { avg: v, cap: cutTot ? v / cutTot * fun : 0 }; });
  const pace = [0, 1, 2].map(k => savedNet(S.tx, shiftMonth(now, -k))).reduce((a, b) => a + b, 0) / 3;
  goals.forEach(g => { const share = goalNeed > 0 ? (g.need / goalNeed) * save : (goals.length ? save / goals.length : 0); g.plan = Math.min(share, g.need || share); g.eta = g.left <= 0 ? 0 : share > 0 ? Math.ceil(g.left / share) : null; });
  return { salary, avgInc, hasHist, months: base.length, ess, essCats, save, fun, caps, goals, goalNeed, tight, pace };
}

// ---------- Área financiera: análisis, proyecciones y deudas ----------
const INV = new Set(['inversion', 'educacion']);
const DEBTC = new Set(['tarjeta']);
const FINSUB = { t: 'analisis', dir: 'owe_me' };
function finBreak(list, mk) {
  const s = monthStats(list, mk); const b = { nec: 0, gus: 0, inv: 0, deu: 0, aho: Math.max(savedNet(list, mk), 0) };
  Object.entries(s.byCat).forEach(([k, v]) => { if (!v) return; if (INV.has(k)) b.inv += v; else if (DEBTC.has(k)) b.deu += v; else if (isEss(k)) b.nec += v; else b.gus += v; });
  list.forEach(t => { if (t.type === 'deuda' && t.dir === 'i_owe' && t.flow === 'out' && monthKey(t.date) === mk) b.deu += txVal(t); });
  return { s, b };
}
function debtLeft(d) { return Math.max(d.amount - (d.pays || []).reduce((a, p) => a + p.amount, 0), 0); }
function debtDays(d) { if (!d.due) return null; const t0 = new Date(todayISO() + 'T00:00'); return Math.round((new Date(d.due + 'T00:00') - t0) / 86400000); }
function finHealth(list, mk) {
  const { s, b } = finBreak(list, mk); if (s.inc <= 0) return null;
  const r = x => x / s.inc; const pts = [];
  const add = (ok, label, got, max, tip) => pts.push({ ok, label, got, max, tip });
  const ra = r(b.aho); add(ra >= 0.2, T(`Ahorro: ${pct(ra)} de lo que ganas`, `Savings: ${pct(ra)}`), ra >= 0.2 ? 25 : ra >= 0.1 ? 15 : ra > 0 ? 8 : 0, 25, T('Lo sano es apartar 20% o más apenas cobras.', 'Aim for 20%+.'));
  const rn = r(b.nec); add(rn <= 0.5, T(`Necesario: ${pct(rn)}`, `Needs: ${pct(rn)}`), rn <= 0.5 ? 20 : rn <= 0.65 ? 10 : 0, 20, T('Lo necesario debería quedarse en la mitad de tus ingresos o menos.', 'Needs ≤ 50%.'));

let dl = null;
async function exportCSV() {
  const rows = [[T('Fecha', 'Date'), T('Tipo', 'Type'), T('Categoría', 'Category'), T('Monto', 'Amount'), T('Moneda', 'Currency'), T('Tasa BCV', 'BCV rate'), T('Nota', 'Note')]]

  const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\n');
  try { await dl.save({ filename: `cuentas-claras-${todayISO()}.csv`, data: '\uFEFF' + csv }); }

const INST = { evt: null, shown: false };
// El ícono de la app es tu mascota: cada una tiene su manifest con sus íconos.
function appIcon(kind) {
  if (!TEST_BUILD) return;
  const k = ['cerdito', 'gato', 'perro', 'guacamaya', 'caiman', 'tigre', 'aguila', 'mosca', 'zancudo'].includes(kind) ? kind : 'cerdito';
  const set = (rel, href) => { const l = document.querySelector(`link[rel="${rel}"]`); if (l && !l.href.endsWith(href)) l.href = href; };
  set('manifest', 'manifest.webmanifest'); set('apple-touch-icon', `icons/${k}-180.png`); set('icon', `icons/${k}-192.png`);
  // El ícono instalado vive en icons/app-*.png; el service worker entrega ahí la mascota elegida,
  // así Chrome la toma en su próxima revisión del ícono sin reinstalar.
  if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage({ pet: k })).catch(() => {});
}
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
if (TEST_BUILD) {
  const head = document.head || document.getElementsByTagName('head')[0];
  if (head && !document.querySelector('link[rel=manifest]')) {
    ['manifest', 'apple-touch-icon', 'icon'].forEach(rel => { const l = document.createElement('link'); l.rel = rel; head.appendChild(l); });
    const m = document.createElement('meta'); m.name = 'theme-color'; m.content = '#16804a'; head.appendChild(m);
    appIcon(((lsGet('cc.cfg', {}) || {}).mascot || {}).kind);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INST.evt = e; if (INST.shown) instDraw(); });

  setTimeout(instMaybe, 1500);
}

    ${INST.evt ? `<button class="primary" data-inst="go">📲 ${T('Instalar ahora', 'Install now')}</button>`
      : `<ol class="steps">${ios
        ? `<li>${T('Toca el botón <b>Compartir</b> (el cuadrito con la flecha hacia arriba).', 'Tap Share.')}</li><li>${T('Elige <b>Agregar a inicio</b>.', 'Choose Add to Home Screen.')}</li><li>${T('Toca <b>Agregar</b>.', 'Tap Add.')}</li>`
        : `<li>${T('Toca los <b>tres puntos ⋮</b> de Chrome, arriba a la derecha.', 'Tap Chrome ⋮ menu.')}</li><li>${T('Elige <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.', 'Choose Install app.')}</li><li>${T('Confirma con <b>Instalar</b>.', 'Confirm Install.')}</li>`}</ol>
        <button class="primary" data-inst="ok">${T('Entendido', 'Got it')}</button>`}
    <button class="linkbtn" data-inst="no" style="justify-self:center">${T('Ahora no', 'Not now')}</button></div>`;
}
function instClose() { const r = document.getElementById('instRoot'); if (r) r.remove(); }
document.addEventListener('click', async e => {
